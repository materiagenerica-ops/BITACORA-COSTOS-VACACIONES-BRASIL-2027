<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Principal - Bitácora Brasil 2027</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brasil: { green: '#009b3a', yellow: '#fedf00', blue: '#002776', dark: '#050b14', card: '#0a1628' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #050b14; color: #f8fafc; margin: 0; padding: 20px; }
        .glass-panel { background: rgba(10, 22, 40, 0.88); backdrop-filter: blur(20px); border: 1px solid rgba(254, 223, 0, 0.18); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center">

    <div class="glass-panel p-8 md:p-12 rounded-3xl max-w-xl w-full text-center shadow-2xl border border-brasil-yellow/20">
        <div class="inline-flex p-4 rounded-2xl bg-brasil-blue/40 text-brasil-yellow mb-6 border border-blue-500/30">
            <i class="fa-solid fa-house-chimney text-4xl"></i>
        </div>
        <h3 class="font-cinzel text-2xl md:text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-brasil-yellow via-white to-brasil-green mb-4">
            Panel Principal de Control
        </h3>
        <p class="text-slate-300 text-sm md:text-base mb-6">
            Bienvenido a la bitácora financiera para las vacaciones a Torres y Capão da Canoa - Brasil 2027. Selecciona una opción en el menú superior para comenzar.
        </p>
        <div class="inline-block px-4 py-2 rounded-xl bg-emerald-950/50 border border-emerald-500/30 text-emerald-400 text-xs font-semibold">
            <i class="fa-solid fa-circle-check mr-2"></i> Sesión Iniciada Correctamente
        </div>
    </div>

</body>
</html>
