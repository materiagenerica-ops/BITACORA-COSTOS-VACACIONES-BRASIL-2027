<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitácora General de Gastos - Brasil 2027</title>
    <link rel="icon" href="data:,">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brasil: { green: '#009b3a', yellow: '#fedf00', blue: '#002776', dark: '#050b14', card: '#0a1628' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #050b14; color: #f8fafc; overflow: hidden; margin: 0; }
        .cinematic-glow { box-shadow: 0 0 50px rgba(0, 155, 58, 0.2), 0 0 100px rgba(254, 223, 0, 0.1); }
        .glass-panel { background: rgba(10, 22, 40, 0.92); backdrop-filter: blur(20px); border: 1px solid rgba(254, 223, 0, 0.18); }
        .glass-input { background: rgba(5, 11, 20, 0.85); border: 1px solid rgba(255, 255, 255, 0.15); color: #fff; }
        .glass-input:focus { border-color: #fedf00; box-shadow: 0 0 20px rgba(254, 223, 0, 0.3); outline: none; }
        .immersive-btn { position: relative; overflow: hidden; transition: all 0.3s ease; cursor: pointer; }
        .immersive-btn::after { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent); transition: 0.5s; }
        .immersive-btn:hover::after { left: 100%; }
    </style>
</head>
<body class="w-screen h-screen flex flex-col bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-950 via-brasil-dark to-black">

    <!-- CONTENEDOR GENERAL -->
    <div class="relative z-10 w-full h-full flex flex-col">

        <!-- ================= PANTALLA DE LOGIN ================= -->
        <div id="login-view" class="w-full h-full flex items-center justify-center p-4" style="display: flex;">
            <div class="glass-panel p-8 md:p-12 rounded-3xl w-full max-w-md cinematic-glow border border-brasil-yellow/20">
                
                <div class="text-center mb-8">
                    <div class="inline-block p-1.5 rounded-2xl bg-gradient-to-tr from-brasil-green via-brasil-yellow to-brasil-blue mb-4 shadow-xl shadow-brasil-green/20">
                        <img id="logotipo_bitacora" src="logotipo_bitacora.jpg" alt="Logo" class="w-20 h-20 object-cover rounded-xl bg-slate-900" onerror="this.src='https://images.unsplash.com/photo-1483445057712-659a76d73f18?w=150&auto=format&fit=crop&q=80'">
                    </div>
                    <h1 class="font-cinzel text-xl md:text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-brasil-yellow via-white to-brasil-green tracking-wide">
                        BITÁCORA GENERAL DE GASTOS
                    </h1>
                    <p class="text-brasil-yellow/80 font-semibold text-xs md:text-sm mt-2 tracking-widest uppercase">
                        Vacaciones Torres / Capao de Canoa - Brasil 2027
                    </p>
                </div>

                <form id="login-form" class="space-y-5">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Usuario</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-500">
                                <i class="fa-solid fa-user"></i>
                            </span>
                            <input type="text" id="username" required class="glass-input w-full pl-11 pr-4 py-3.5 rounded-xl placeholder-slate-600 font-medium text-sm" placeholder="Usuario">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Contraseña</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-500">
                                <i class="fa-solid fa-lock"></i>
                            </span>
                            <input type="password" id="password" required class="glass-input w-full pl-11 pr-4 py-3.5 rounded-xl placeholder-slate-600 font-medium text-sm" placeholder="••••••••">
                        </div>
                    </div>

                    <div id="login-error" class="hidden text-red-400 text-xs text-center font-semibold bg-red-950/50 p-3 rounded-xl border border-red-500/30">
                        Usuario o contraseña incorrectos.
                    </div>

                    <button type="submit" class="immersive-btn w-full py-4 rounded-xl bg-gradient-to-r from-brasil-green via-emerald-600 to-brasil-blue text-white font-bold tracking-wider uppercase text-xs shadow-lg shadow-brasil-green/30 active:scale-[0.98]">
                        <i class="fa-solid fa-arrow-right-to-bracket mr-2"></i> Ingresar al Sistema
                    </button>
                </form>
            </div>
        </div>

        <!-- ================= PANTALLA CENTRAL (DASHBOARD) ================= -->
        <div id="central-view" class="w-full h-full flex-col" style="display: none;">
            
            <!-- ENCABEZADO SUPERIOR -->
            <header class="glass-panel border-b border-white/10 px-6 py-3.5 flex items-center justify-between z-20 shadow-2xl shrink-0">
                <div>
                    <h2 class="font-cinzel text-sm md:text-lg font-bold text-transparent bg-clip-text bg-gradient-to-r from-brasil-yellow via-white to-brasil-green">
                        BITÁCORA GENERAL DE GASTOS
                    </h2>
                    <p class="text-[10px] md:text-xs text-brasil-yellow/70 tracking-wider uppercase font-semibold">
                        Vacaciones Torres / Capao de Canoa - Brasil 2027
                    </p>
                </div>

                <div class="flex items-center space-x-4">
                    <img src="logotipo_bitacora.jpg" alt="Logo" class="w-11 h-11 rounded-xl object-cover border border-brasil-yellow/40 shadow-md" onerror="this.src='https://images.unsplash.com/photo-1483445057712-659a76d73f18?w=150&auto=format&fit=crop&q=80'">
                    
                    <button id="btn-salir" class="immersive-btn px-3.5 py-2 rounded-xl bg-red-600/20 hover:bg-red-600/40 border border-red-500/40 text-red-300 font-semibold text-xs uppercase transition flex items-center space-x-1.5">
                        <i class="fa-solid fa-power-off"></i>
                        <span class="hidden sm:inline">Salir</span>
                    </button>
                </div>
            </header>

            <!-- BARRA DE MENÚ INMEDIATAMENTE DEBAJO DEL ENCABEZADO -->
            <nav class="glass-panel border-b border-white/10 px-4 py-2.5 z-20 shadow-lg shrink-0">
                <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-center gap-2 md:gap-3">
                    
                    <button onclick="loadModule('menu.html', this)" class="nav-btn immersive-btn px-4 py-2 rounded-xl bg-brasil-blue/80 border border-blue-400/50 text-white font-semibold text-xs md:text-sm tracking-wide uppercase flex items-center space-x-2 shadow-lg">
                        <i class="fa-solid fa-house text-brasil-yellow"></i>
                        <span>Menú</span>
                    </button>

                    <button onclick="loadModule('calculo_final.html', this)" class="nav-btn immersive-btn px-4 py-2 rounded-xl bg-slate-800/70 hover:bg-brasil-green/40 border border-white/10 text-slate-200 hover:text-white font-semibold text-xs md:text-sm tracking-wide uppercase flex items-center space-x-2">
                        <i class="fa-solid fa-calculator text-brasil-green"></i>
                        <span>Cálculo Final</span>
                    </button>

                    <button onclick="loadModule('combustible.html', this)" class="nav-btn immersive-btn px-4 py-2 rounded-xl bg-slate-800/70 hover:bg-brasil-yellow/30 border border-white/10 text-slate-200 hover:text-white font-semibold text-xs md:text-sm tracking-wide uppercase flex items-center space-x-2">
                        <i class="fa-solid fa-gas-pump text-amber-400"></i>
                        <span>Combustible</span>
                    </button>

                    <button onclick="loadModule('playa.html', this)" class="nav-btn immersive-btn px-4 py-2 rounded-xl bg-slate-800/70 hover:bg-cyan-600/40 border border-white/10 text-slate-200 hover:text-white font-semibold text-xs md:text-sm tracking-wide uppercase flex items-center space-x-2">
                        <i class="fa-solid fa-umbrella-beach text-cyan-400"></i>
                        <span>Playa</span>
                    </button>

                    <button onclick="loadModule('hoteles.html', this)" class="nav-btn immersive-btn px-4 py-2 rounded-xl bg-slate-800/70 hover:bg-purple-600/40 border border-white/10 text-slate-200 hover:text-white font-semibold text-xs md:text-sm tracking-wide uppercase flex items-center space-x-2">
                        <i class="fa-solid fa-hotel text-purple-400"></i>
                        <span>Hoteles</span>
                    </button>

                    <!-- Nuevo Botón Costos Alimentos -->
                    <button onclick="loadModule('alimentos.html', this)" class="nav-btn immersive-btn px-4 py-2 rounded-xl bg-slate-800/70 hover:bg-amber-600/40 border border-white/10 text-slate-200 hover:text-white font-semibold text-xs md:text-sm tracking-wide uppercase flex items-center space-x-2">
                        <i class="fa-solid fa-utensils text-amber-400"></i>
                        <span>Costos Alimentos</span>
                    </button>

                </div>
            </nav>

            <!-- CONTENEDOR IFRAME CENTRAL -->
            <main class="flex-1 relative bg-slate-950/70 overflow-hidden">
                <iframe id="content-iframe" name="content-iframe" src="menu.html" class="w-full h-full border-0"></iframe>
            </main>

        </div>

    </div>

    <!-- SCRIPT LOGICA Y FIREBASE -->
    <script type="module" src="app.js"></script>
</body>
</html>
