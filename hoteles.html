<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoteles y Alojamientos - Bitácora Brasil 2027</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brasil: { green: '#009b3a', yellow: '#fedf00', blue: '#002776', dark: '#050b14', card: '#0a1628' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #050b14; color: #f8fafc; margin: 0; padding: 20px; }
        .glass-panel { background: rgba(10, 22, 40, 0.88); backdrop-filter: blur(20px); border: 1px solid rgba(254, 223, 0, 0.18); }
        .glass-input { background: rgba(5, 11, 20, 0.75); border: 1px solid rgba(255, 255, 255, 0.12); color: #fff; }
        .glass-input:focus { border-color: #fedf00; box-shadow: 0 0 20px rgba(254, 223, 0, 0.3); outline: none; }
        .immersive-btn { position: relative; overflow: hidden; transition: all 0.3s ease; cursor: pointer; }
        .immersive-btn::after { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent); transition: 0.5s; }
        .immersive-btn:hover::after { left: 100%; }
        .immersive-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(254, 223, 0, 0.3); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #050b14; }
        ::-webkit-scrollbar-thumb { background: #002776; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen">

    <div class="max-w-5xl mx-auto space-y-8 pb-12">
        
        <!-- ENCABEZADO DE MÓDULO -->
        <div class="glass-panel p-6 md:p-8 rounded-3xl border border-brasil-yellow/20 shadow-2xl">
            <h3 class="font-cinzel text-2xl font-bold text-amber-400 mb-2 flex items-center">
                <i class="fa-solid fa-hotel mr-3 text-amber-400"></i> Control de Hoteles y Alojamientos
            </h3>
            <p class="text-slate-300 text-sm">Registra las reservas de hospedaje en Torres o Capão da Canoa, controla las noches, ocupantes y costos en pesos.</p>
        </div>

        <!-- FORMULARIO DE INGRESO -->
        <div class="glass-panel p-6 md:p-8 rounded-3xl border border-brasil-yellow/20 shadow-2xl space-y-6">
            <input type="hidden" id="hotel-id">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">
                        <i class="fa-solid fa-building text-amber-400 mr-1.5"></i> Hotel / Alojamiento:
                    </label>
                    <input type="text" id="hotel_nombre" class="glass-input w-full px-4 py-3 rounded-xl text-sm" placeholder="Ej: Hotel De Torres">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">
                        <i class="fa-solid fa-map-pin text-cyan-400 mr-1.5"></i> Lugar:
                    </label>
                    <select id="hotel_lugar" class="glass-input w-full px-4 py-3 rounded-xl text-sm">
                        <option value="Torres">Torres</option>
                        <option value="Capão da Canoa">Capão da Canoa</option>
                        <option value="Otro">Otro en el trayecto</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">
                        <i class="fa-solid fa-calendar-check text-emerald-400 mr-1.5"></i> Check-in:
                    </label>
                    <input type="date" id="check_in" class="glass-input w-full px-4 py-3 rounded-xl text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">
                        <i class="fa-solid fa-calendar-xmark text-rose-400 mr-1.5"></i> Check-out:
                    </label>
                    <input type="date" id="check_out" class="glass-input w-full px-4 py-3 rounded-xl text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">
                        <i class="fa-solid fa-moon text-yellow-400 mr-1.5"></i> Cantidad de Noches:
                    </label>
                    <input type="text" id="cantidad_noches" class="glass-input w-full px-4 py-3 rounded-xl text-sm bg-slate-900/50 font-bold text-amber-300" readonly value="0">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">
                        <i class="fa-solid fa-users text-blue-400 mr-1.5"></i> Cantidad de Personas:
                    </label>
                    <input type="text" inputmode="numeric" id="cantidad_personas" class="glass-input w-full px-4 py-3 rounded-xl text-sm" placeholder="Ej: 4" value="2">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">
                        <i class="fa-solid fa-money-bill-wave text-brasil-green mr-1.5"></i> Costo en Pesos ($ ARS):
                    </label>
                    <input type="text" inputmode="decimal" id="costo_pesos" class="glass-input w-full px-4 py-3 rounded-xl text-sm" placeholder="Ej: 350000">
                </div>
            </div>

            <!-- BOTONES DE ACCIÓN -->
            <div class="flex flex-wrap items-center gap-4 pt-4 border-t border-white/10">
                <button type="button" onclick="window.guardarHotel()" class="immersive-btn px-8 py-4 rounded-xl bg-gradient-to-r from-brasil-green to-emerald-700 text-white font-bold tracking-wider uppercase text-xs shadow-xl">
                    <i class="fa-solid fa-floppy-disk mr-2"></i> Guardar Hotel
                </button>
                <button type="button" id="btn-cancelar-edicion" onclick="window.cancelarEdicionHotel()" class="hidden px-5 py-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold tracking-wider uppercase text-xs">
                    Cancelar Edición
                </button>
            </div>
        </div>

        <!-- HISTORIAL -->
        <div class="glass-panel p-6 md:p-8 rounded-3xl border border-brasil-yellow/20 shadow-2xl">
            <h4 class="font-cinzel text-lg font-bold text-white mb-4">Historial de Alojamientos Registrados</h4>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="bg-slate-900/80 text-xs uppercase text-brasil-yellow tracking-wider border-b border-white/10">
                        <tr>
                            <th class="p-3">Hotel / Lugar</th>
                            <th class="p-3">Fechas (Check-in / Out)</th>
                            <th class="p-3">Noches / Pax</th>
                            <th class="p-3 text-brasil-green">Costo en Pesos</th>
                            <th class="p-3 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="historial-hoteles-body" class="divide-y divide-white/5">
                        <!-- Dinámico -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- SCRIPT DE FIRESTORE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, deleteDoc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
