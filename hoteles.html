<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoteles y Alojamientos - Bitácora Brasil 2027</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brasil: { green: '#009b3a', yellow: '#fedf00', blue: '#002776', dark: '#050b14', card: '#0a1628' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #050b14; color: #f8fafc; margin: 0; padding: 20px; }
        .glass-panel { background: rgba(10, 22, 40, 0.88); backdrop-filter: blur(20px); border: 1px solid rgba(254, 223, 0, 0.18); }
        .glass-input { background: rgba(5, 11, 20, 0.75); border: 1px solid rgba(255, 255, 255, 0.12); color: #fff; }
        .glass-input:focus { border-color: #fedf00; box-shadow: 0 0 20px rgba(254, 223, 0, 0.3); outline: none; }
        .immersive-btn { position: relative; overflow: hidden; transition: all 0.3s ease; cursor: pointer; }
        .immersive-btn::after { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent); transition: 0.5s; }
        .immersive-btn:hover::after { left: 100%; }
        .immersive-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(254, 223, 0, 0.3); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #050b14; }
        ::-webkit-scrollbar-thumb { background: #002776; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen">

    <div class="max-w-5xl mx-auto space-y-8 pb-12">
        
        <!-- ENCABEZADO DE MÓDULO -->
        <div class="glass-panel p-6 md:p-8 rounded-3xl border border-brasil-yellow/20 shadow-2xl">
            <h3 class="font-cinzel text-2xl font-bold text-amber-400 mb-2 flex items-center">
                <i class="fa-solid fa-hotel mr-3 text-amber-400"></i> Control de Hoteles y Alojamientos
            </h3>
            <p class="text-slate-300 text-sm">Registra las reservas de hospedaje, controla las noches, ocupantes y costos en Pesos o Reales.</p>
        </div>

        <!-- FORMULARIO DE INGRESO -->
        <div class="glass-panel p-6 md:p-8 rounded-3xl border border-brasil-yellow/20 shadow-2xl space-y-6">
            <input type="hidden" id="hotel-id">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">
                        <i class="fa-solid fa-building text-amber-400 mr-1.5"></i> Hotel / Alojamiento:
                    </label>
                    <input type="text" id="hotel_nombre" class="glass-input w-full px-4 py-3 rounded-xl text-sm" placeholder="Ej: Hotel De Torres">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">
                        <i class="fa-solid fa-map-pin text-cyan-400 mr-1.5"></i> Lugar:
                    </label>
                    <select id="hotel_lugar" class="glass-input w-full px-4 py-3 rounded-xl text-sm">
                        <option value="Sao Gabriel">Sao Gabriel</option>
                        <option value="Capão da Canoa">Capão da Canoa</option>
                        <option value="Torres">Torres</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">
                        <i class="fa-solid fa-calendar-check text-emerald-400 mr-1.5"></i> Check-in:
                    </label>
                    <input type="date" id="check_in" class="glass-input w-full px-4 py-3 rounded-xl text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">
                        <i class="fa-solid fa-calendar-xmark text-rose-400 mr-1.5"></i> Check-out:
                    </label>
                    <input type="date" id="check_out" class="glass-input w-full px-4 py-3 rounded-xl text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">
                        <i class="fa-solid fa-moon text-yellow-400 mr-1.5"></i> Cantidad de Noches:
                    </label>
                    <input type="text" inputmode="numeric" id="cantidad_noches" class="glass-input w-full px-4 py-3 rounded-xl text-sm font-bold text-amber-300" value="1" placeholder="Ej: 2">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">
                        <i class="fa-solid fa-users text-blue-400 mr-1.5"></i> Cantidad de Personas:
                    </label>
                    <input type="text" inputmode="numeric" id="cantidad_personas" class="glass-input w-full px-4 py-3 rounded-xl text-sm" placeholder="Ej: 4" value="2">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">
                        <i class="fa-solid fa-coins text-brasil-green mr-1.5"></i> Moneda del Costo:
                    </label>
                    <select id="moneda_hotel" class="glass-input w-full px-4 py-3 rounded-xl text-sm font-bold text-brasil-yellow bg-slate-900">
                        <option value="ARS">🇦🇷 Pesos Argentinos ($ ARS)</option>
                        <option value="BRL">🇧🇷 Reales (R$)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2" id="label-costo-hotel">
                        <i class="fa-solid fa-money-bill-wave text-brasil-green mr-1.5"></i> Costo Total:
                    </label>
                    <input type="text" inputmode="decimal" id="costo_hotel" class="glass-input w-full px-4 py-3 rounded-xl text-sm font-bold text-brasil-green" placeholder="Ej: 350000">
                </div>
            </div>

            <!-- BOTONES DE ACCIÓN -->
            <div class="flex flex-wrap items-center gap-4 pt-4 border-t border-white/10">
                <button type="button" onclick="window.guardarHotel()" class="immersive-btn px-8 py-4 rounded-xl bg-gradient-to-r from-brasil-green to-emerald-700 text-white font-bold tracking-wider uppercase text-xs shadow-xl">
                    <i class="fa-solid fa-floppy-disk mr-2"></i> Guardar Hotel
                </button>
                <button type="button" id="btn-cancelar-edicion" onclick="window.cancelarEdicionHotel()" class="hidden px-5 py-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold tracking-wider uppercase text-xs">
                    Cancelar Edición
                </button>
            </div>
        </div>

        <!-- HISTORIAL -->
        <div class="glass-panel p-6 md:p-8 rounded-3xl border border-brasil-yellow/20 shadow-2xl">
            <h4 class="font-cinzel text-lg font-bold text-white mb-4">Historial de Alojamientos Registrados</h4>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="bg-slate-900/80 text-xs uppercase text-brasil-yellow tracking-wider border-b border-white/10">
                        <tr>
                            <th class="p-3">Hotel / Lugar</th>
                            <th class="p-3">Fechas (Check-in / Out)</th>
                            <th class="p-3">Noches / Pax</th>
                            <th class="p-3 text-brasil-green">Costo Total</th>
                            <th class="p-3 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="historial-hoteles-body" class="divide-y divide-white/5">
                        <!-- Dinámico -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- SCRIPT DE FIRESTORE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, deleteDoc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDGFHR5hzOFtg7wnM2DGJfBTxPp-h8vyp0",
          authDomain: "bitacora-costos-brasil.firebaseapp.com",
          projectId: "bitacora-costos-brasil",
          storageBucket: "bitacora-costos-brasil.firebasestorage.app",
          messagingSenderId: "558877802256",
          appId: "1:558877802256:web:580e6a100a17b0ba062f95"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const hotelNombreInput = document.getElementById("hotel_nombre");
        const hotelLugarInput = document.getElementById("hotel_lugar");
        const checkInInput = document.getElementById("check_in");
        const checkOutInput = document.getElementById("check_out");
        const cantidadNochesInput = document.getElementById("cantidad_noches");
        const cantidadPersonasInput = document.getElementById("cantidad_personas");
        const monedaHotelSelect = document.getElementById("moneda_hotel");
        const costoHotelInput = document.getElementById("costo_hotel");
        const labelCostoHotel = document.getElementById("label-costo-hotel");
        const hotelIdInput = document.getElementById("hotel-id");
        const btnCancelar = document.getElementById("btn-cancelar-edicion");
        const btnGuardar = document.querySelector("button[onclick='window.guardarHotel()']");
        const historialBody = document.getElementById("historial-hoteles-body");

        function parsearNumero(valor) {
            if (!valor) return 0;
            return parseFloat(valor.toString().replace(',', '.')) || 0;
        }

        function actualizarLabelMoneda() {
            const moneda = monedaHotelSelect.value;
            if (moneda === 'BRL') {
                labelCostoHotel.innerHTML = `<i class="fa-solid fa-money-bill-wave text-brasil-green mr-1.5"></i> Costo en Reales (R$):`;
                costoHotelInput.placeholder = "Ej: 1200.00";
            } else {
                labelCostoHotel.innerHTML = `<i class="fa-solid fa-money-bill-wave text-brasil-green mr-1.5"></i> Costo en Pesos ($ ARS):`;
                costoHotelInput.placeholder = "Ej: 350000";
            }
        }

        monedaHotelSelect.addEventListener("change", actualizarLabelMoneda);

        function calcularNoches() {
            const checkInVal = checkInInput.value;
            const checkOutVal = checkOutInput.value;

            if (checkInVal && checkOutVal) {
                const fechaIn = new Date(checkInVal);
                const fechaOut = new Date(checkOutVal);
                const diferenciaTiempo = fechaOut - fechaIn;
                const dias = Math.round(diferenciaTiempo / (1000 * 60 * 60 * 24));

                if (dias > 0) {
                    cantidadNochesInput.value = dias;
                }
            }
        }

        checkInInput.addEventListener("change", calcularNoches);
        checkOutInput.addEventListener("change", calcularNoches);

        window.guardarHotel = async function() {
            const id = hotelIdInput.value;
            const nombre = hotelNombreInput.value.trim();
            const lugar = hotelLugarInput.value;
            const checkIn = checkInInput.value;
            const checkOut = checkOutInput.value;
            const noches = parseInt(cantidadNochesInput.value) || 0;
            const personas = parseInt(cantidadPersonasInput.value) || 0;
            const moneda = monedaHotelSelect.value;
            const costo = parsearNumero(costoHotelInput.value);

            if (!nombre) {
                alert("Por favor ingresa el nombre del hotel.");
                return;
            }
            if (noches <= 0) {
                alert("La cantidad de noches debe ser mayor a 0.");
                return;
            }
            if (costo <= 0) {
                alert("Ingresa un costo válido mayor a 0.");
                return;
            }

            const hotelData = {
                nombre,
                lugar,
                checkIn: checkIn || "Sin especificar",
                checkOut: checkOut || "Sin especificar",
                noches,
                personas,
                moneda,
                costo: costo.toFixed(2),
                timestamp: Date.now()
            };

            try {
                if (id) {
                    await updateDoc(doc(db, "hoteles_reservas", id), hotelData);
                    alert("¡Reserva de hotel actualizada con éxito!");
                } else {
                    await addDoc(collection(db, "hoteles_reservas"), hotelData);
                    alert("¡Reserva de hotel guardada con éxito!");
                }
                window.cancelarEdicionHotel();
            } catch (err) {
                alert("Error al guardar en Firestore: " + err.message);
            }
        };

        window.cancelarEdicionHotel = function() {
            hotelNombreInput.value = "";
            hotelLugarInput.value = "Sao Gabriel";
            checkInInput.value = "";
            checkOutInput.value = "";
            cantidadNochesInput.value = "1";
            cantidadPersonasInput.value = "2";
            monedaHotelSelect.value = "ARS";
            costoHotelInput.value = "";
            hotelIdInput.value = "";
            actualizarLabelMoneda();
            if (btnCancelar) btnCancelar.classList.add("hidden");
            if (btnGuardar) btnGuardar.innerHTML = `<i class="fa-solid fa-floppy-disk mr-2"></i> Guardar Hotel`;
        };

        onSnapshot(collection(db, "hoteles_reservas"), (snapshot) => {
            if (!historialBody) return;
            historialBody.innerHTML = "";
            if (!snapshot.empty) {
                let docs = [];
                snapshot.forEach(docSnap => {
                    docs.push({ id: docSnap.id, ...docSnap.data() });
                });
                docs.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

                docs.forEach(item => {
                    const monto = parseFloat(item.costo || item.costoPesos) || 0;
                    const moneda = (item.moneda || 'ARS').toUpperCase();
                    const sim = moneda === 'BRL' ? 'R$' : '$';
                    const sufijo = moneda === 'BRL' ? 'BRL' : 'ARS';

                    const tr = document.createElement("tr");
                    tr.className = "hover:bg-slate-900/40 transition border-b border-white/5";
                    tr.innerHTML = `
                        <td class="p-3">
                            <div class="font-semibold text-white"><i class="fa-solid fa-hotel mr-2 text-amber-400"></i>${item.nombre}</div>
                            <div class="text-xs text-cyan-300 mt-0.5"><i class="fa-solid fa-map-pin mr-1"></i>${item.lugar}</div>
                        </td>
                        <td class="p-3 text-xs text-slate-300">
                            <div><span class="text-emerald-400">In:</span> ${item.checkIn}</div>
                            <div><span class="text-rose-400">Out:</span> ${item.checkOut}</div>
                        </td>
                        <td class="p-3 text-xs text-slate-300">
                            <div><span class="text-yellow-400 font-semibold">${item.noches}</span> noches</div>
                            <div><span class="text-blue-400 font-semibold">${item.personas}</span> pax</div>
                        </td>
                        <td class="p-3 font-cinzel font-bold text-brasil-green text-base bg-emerald-950/20 rounded">
                            ${sim} ${monto.toLocaleString('es-AR', {minimumFractionDigits: 2})} ${sufijo}
                        </td>
                        <td class="p-3 text-center space-x-2">
                            <button type="button" onclick="window.editarHotel('${item.id}', '${item.nombre}', '${item.lugar}', '${item.checkIn}', '${item.checkOut}', ${item.noches}, ${item.personas}, '${moneda}', ${monto})" class="px-2.5 py-1.5 bg-blue-600/40 text-blue-300 rounded text-xs" title="Editar"><i class="fa-solid fa-pen"></i></button>
                            <button type="button" onclick="window.eliminarHotel('${item.id}')" class="px-2.5 py-1.5 bg-red-600/40 text-red-300 rounded text-xs" title="Eliminar"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    `;
                    historialBody.appendChild(tr);
                });
            } else {
                historialBody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-500 italic">Sin reservas de hoteles registradas.</td></tr>`;
            }
        });

        window.editarHotel = function(id, nombre, lugar, checkIn, checkOut, noches, personas, moneda, costo) {
            hotelIdInput.value = id;
            hotelNombreInput.value = nombre;
            hotelLugarInput.value = lugar;
            checkInInput.value = checkIn !== "Sin especificar" ? checkIn : "";
            checkOutInput.value = checkOut !== "Sin especificar" ? checkOut : "";
            cantidadNochesInput.value = noches;
            cantidadPersonasInput.value = personas;
            monedaHotelSelect.value = moneda || 'ARS';
            costoHotelInput.value = costo;
            actualizarLabelMoneda();

            if (btnCancelar) btnCancelar.classList.remove("hidden");
            if (btnGuardar) btnGuardar.innerHTML = `<i class="fa-solid fa-pen-to-square mr-2"></i> Actualizar Hotel`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.eliminarHotel = async function(id) {
            if (confirm("¿Estás seguro de eliminar esta reserva de hotel?")) {
                try {
                    await deleteDoc(doc(db, "hoteles_reservas", id));
                    alert("Reserva eliminada correctamente");
                } catch (err) {
                    alert("Error al eliminar: " + err.message);
                }
            }
        };

        actualizarLabelMoneda();
    </script>
</body>
</html>
