<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoteles y Alojamientos - Bitácora Brasil 2027</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brasil: { green: '#009b3a', yellow: '#fedf00', blue: '#002776', dark: '#050b14', card: '#0a1628' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #050b14; color: #f8fafc; margin: 0; padding: 20px; }
        .glass-panel { background: rgba(10, 22, 40, 0.88); backdrop-filter: blur(20px); border: 1px solid rgba(254, 223, 0, 0.18); }
        .glass-input { background: rgba(5, 11, 20, 0.75); border: 1px solid rgba(255, 255, 255, 0.12); color: #fff; }
        .glass-input:focus { border-color: #fedf00; box-shadow: 0 0 20px rgba(254, 223, 0, 0.3); outline: none; }
        .immersive-btn { position: relative; overflow: hidden; transition: all 0.3s ease; cursor: pointer; }
    </style>
</head>
<body class="min-h-screen">

    <div class="max-w-5xl mx-auto space-y-8 pb-12">
        
        <!-- ENCABEZADO -->
        <div class="glass-panel p-6 md:p-8 rounded-3xl border border-brasil-yellow/20 shadow-2xl">
            <h3 class="font-cinzel text-2xl font-bold text-amber-400 mb-2 flex items-center">
                <i class="fa-solid fa-hotel mr-3 text-amber-400"></i> Control de Hoteles y Alojamientos
            </h3>
            <p class="text-slate-300 text-sm">Registro de hospedaje con selección independiente de moneda (Pesos o Reales).</p>
        </div>

        <!-- FORMULARIO -->
        <div class="glass-panel p-6 md:p-8 rounded-3xl border border-brasil-yellow/20 shadow-2xl space-y-6">
            <input type="hidden" id="hotel-id">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Hotel / Alojamiento:</label>
                    <input type="text" id="hotel_nombre" class="glass-input w-full px-4 py-3 rounded-xl text-sm" placeholder="Ej: Hotel De Torres">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Lugar:</label>
                    <select id="hotel_lugar" class="glass-input w-full px-4 py-3 rounded-xl text-sm bg-slate-900 text-white">
                        <option value="Sao Gabriel">Sao Gabriel</option>
                        <option value="Capão da Canoa">Capão da Canoa</option>
                        <option value="Torres">Torres</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Check-in:</label>
                    <input type="date" id="check_in" class="glass-input w-full px-4 py-3 rounded-xl text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Check-out:</label>
                    <input type="date" id="check_out" class="glass-input w-full px-4 py-3 rounded-xl text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Cantidad de Noches:</label>
                    <input type="number" id="cantidad_noches" class="glass-input w-full px-4 py-3 rounded-xl text-sm font-bold text-amber-300" value="1" min="1">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Cantidad de Personas:</label>
                    <input type="number" id="cantidad_personas" class="glass-input w-full px-4 py-3 rounded-xl text-sm" value="2" min="1">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-amber-400 mb-2">Moneda:</label>
                    <select id="moneda_hotel" class="glass-input w-full px-4 py-3 rounded-xl text-sm font-bold text-amber-300 bg-slate-900">
                        <option value="ARS">Pesos ($ ARS)</option>
                        <option value="BRL">Reales (R$)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-brasil-green mb-2" id="label-costo">Costo Total:</label>
                    <input type="number" id="costo_hotel" class="glass-input w-full px-4 py-3 rounded-xl text-sm font-bold text-brasil-green" placeholder="Monto" step="any">
                </div>
            </div>

            <div class="flex flex-wrap items-center gap-4 pt-4 border-t border-white/10">
                <button type="button" id="btn-guardar" class="immersive-btn px-8 py-4 rounded-xl bg-brasil-green text-white font-bold tracking-wider uppercase text-xs shadow-xl cursor-pointer">Guardar Hotel</button>
                <button type="button" id="btn-cancelar" class="hidden px-5 py-4 rounded-xl bg-slate-800 text-slate-300 font-bold tracking-wider uppercase text-xs cursor-pointer">Cancelar Edición</button>
            </div>
        </div>

        <!-- HISTORIAL -->
        <div class="glass-panel p-6 md:p-8 rounded-3xl border border-brasil-yellow/20 shadow-2xl">
            <h4 class="font-cinzel text-lg font-bold text-white mb-4">Historial de Alojamientos</h4>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="bg-slate-900/80 text-xs uppercase text-brasil-yellow tracking-wider border-b border-white/10">
                        <tr>
                            <th class="p-3">Hotel / Lugar</th>
                            <th class="p-3">Fechas</th>
                            <th class="p-3">Noches / Pax</th>
                            <th class="p-3 text-brasil-green">Costo Total</th>
                            <th class="p-3 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="historial-hoteles-body" class="divide-y divide-white/5"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, deleteDoc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const db = getFirestore(initializeApp({
          apiKey: "AIzaSyDGFHR5hzOFtg7wnM2DGJfBTxPp-h8vyp0",
          authDomain: "bitacora-costos-brasil.firebaseapp.com",
          projectId: "bitacora-costos-brasil",
          storageBucket: "bitacora-costos-brasil.firebasestorage.app",
          messagingSenderId: "558877802256",
          appId: "1:558877802256:web:580e6a100a17b0ba062f95"
        }));

        const nombreInput = document.getElementById("hotel_nombre");
        const lugarInput = document.getElementById("hotel_lugar");
        const checkInInput = document.getElementById("check_in");
        const checkOutInput = document.getElementById("check_out");
        const nochesInput = document.getElementById("cantidad_noches");
        const personasInput = document.getElementById("cantidad_personas");
        const monedaSelect = document.getElementById("moneda_hotel");
        const costoInput = document.getElementById("costo_hotel");
        const labelCosto = document.getElementById("label-costo");
        const hotelIdInput = document.getElementById("hotel-id");
        const btnGuardar = document.getElementById("btn-guardar");
        const btnCancelar = document.getElementById("btn-cancelar");
        const historialBody = document.getElementById("historial-hoteles-body");

        // Cambio directo de etiqueta al modificar el select de moneda
        monedaSelect.addEventListener("change", function() {
            if (this.value === 'BRL') {
                labelCosto.textContent = "Costo en Reales (R$):";
                costoInput.placeholder = "Ej: 1500";
            } else {
                labelCosto.textContent = "Costo en Pesos ($):";
                costoInput.placeholder = "Ej: 350000";
            }
        });

        function calcularDiasNoches() {
            if (checkInInput.value && checkOutInput.value) {
                const diff = new Date(checkOutInput.value) - new Date(checkInInput.value);
                const dias = Math.round(diff / (1000 * 60 * 60 * 24));
                if (dias > 0) nochesInput.value = dias;
            }
        }

        checkInInput.addEventListener("change", calcularDiasNoches);
        checkOutInput.addEventListener("change", calcularDiasNoches);

        btnGuardar.addEventListener("click", async function() {
            const id = hotelIdInput.value;
            const nombre = nombreInput.value.trim();
            const lugar = lugarInput.value;
            const checkIn = checkInInput.value || "Sin especificar";
            const checkOut = checkOutInput.value || "Sin especificar";
            const noches = parseInt(nochesInput.value) || 1;
            const personas = parseInt(personasInput.value) || 1;
            const moneda = monedaSelect.value;
            const costo = parseFloat(costoInput.value) || 0;

            if (!nombre) { alert("Ingresa el nombre del hotel"); return; }
            if (costo <= 0) { alert("Ingresa un costo válido mayor a 0"); return; }

            const data = {
                nombre,
                lugar,
                checkIn,
                checkOut,
                noches,
                personas,
                moneda,
                costo: costo.toFixed(2),
                timestamp: Date.now()
            };

            try {
                if (id) {
                    await updateDoc(doc(db, "hoteles_reservas", id), data);
                    alert("Hotel actualizado con éxito");
                } else {
                    await addDoc(collection(db, "hoteles_reservas"), data);
                    alert("Hotel guardado con éxito");
                }
                limpiarFormulario();
            } catch (e) {
                alert("Error al guardar: " + e.message);
            }
        });

        function limpiarFormulario() {
            hotelIdInput.value = "";
            nombreInput.value = "";
            checkInInput.value = "";
            checkOutInput.value = "";
            nochesInput.value = "1";
            personasInput.value = "2";
            monedaSelect.value = "ARS";
            costoInput.value = "";
            labelCosto.textContent = "Costo Total:";
            btnCancelar.classList.add("hidden");
            btnGuardar.textContent = "Guardar Hotel";
        }

        btnCancelar.addEventListener("click", limpiarFormulario);

        onSnapshot(collection(db, "hoteles_reservas"), (snapshot) => {
            historialBody.innerHTML = "";
            if (!snapshot.empty) {
                let registros = [];
                snapshot.forEach(docSnap => {
                    registros.push({ id: docSnap.id, ...docSnap.data() });
                });
                registros.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

                registros.forEach(item => {
                    const moneda = (item.moneda || 'ARS').toUpperCase();
                    const monto = parseFloat(item.costo || item.costoPesos) || 0;
                    const sim = moneda === 'BRL' ? 'R$' : '$';
                    const suf = moneda === 'BRL' ? 'BRL' : 'ARS';

                    const tr = document.createElement("tr");
                    tr.className = "border-b border-white/5 hover:bg-slate-900/40 transition";
                    tr.innerHTML = `
                        <td class="p-3 font-semibold text-white">${item.nombre} <span class="text-xs text-cyan-400 block">${item.lugar}</span></td>
                        <td class="p-3 text-xs">In: ${item.checkIn}<br>Out: ${item.checkOut}</td>
                        <td class="p-3 text-xs">${item.noches} noches / ${item.personas} pax</td>
                        <td class="p-3 font-cinzel font-bold text-brasil-green">${sim} ${monto.toLocaleString('es-AR', {minimumFractionDigits: 2})} ${suf}</td>
                        <td class="p-3 text-center space-x-2">
                            <button type="button" class="text-blue-400 cursor-pointer btn-editar" title="Editar"><i class="fa-solid fa-pen"></i></button>
                            <button type="button" class="text-red-400 cursor-pointer btn-eliminar" title="Eliminar"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    `;

                    // Asignación limpia de eventos por cada fila sin depender de JSON en atributos HTML
                    tr.querySelector(".btn-editar").addEventListener("click", () => {
                        hotelIdInput.value = item.id;
                        nombreInput.value = item.nombre;
                        lugarInput.value = item.lugar || "Sao Gabriel";
                        checkInInput.value = item.checkIn !== "Sin especificar" ? item.checkIn : "";
                        checkOutInput.value = item.checkOut !== "Sin especificar" ? item.checkOut : "";
                        nochesInput.value = item.noches || 1;
                        personasInput.value = item.personas || 2;
                        monedaSelect.value = moneda;
                        costoInput.value = monto;

                        if (moneda === 'BRL') {
                            labelCosto.textContent = "Costo en Reales (R$):";
                        } else {
                            labelCosto.textContent = "Costo en Pesos ($):";
                        }

                        btnCancelar.classList.remove("hidden");
                        btnGuardar.textContent = "Actualizar Hotel";
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    });

                    tr.querySelector(".btn-eliminar").addEventListener("click", async () => {
                        if (confirm("¿Estás seguro de eliminar este registro?")) {
                            try {
                                await deleteDoc(doc(db, "hoteles_reservas", item.id));
                            } catch (e) {
                                alert("Error al eliminar: " + e.message);
                            }
                        }
                    });

                    historialBody.appendChild(tr);
                });
            } else {
                historialBody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-500 italic">Sin registros de hoteles.</td></tr>`;
            }
        });
    </script>
</body>
</html>
