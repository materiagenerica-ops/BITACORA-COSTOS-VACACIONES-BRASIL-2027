<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú y Comidas - Bitácora Brasil 2027</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brasil: { green: '#009b3a', yellow: '#fedf00', blue: '#002776', dark: '#050b14', card: '#0a1628' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #050b14; color: #f8fafc; margin: 0; padding: 20px; }
        .glass-panel { background: rgba(10, 22, 40, 0.88); backdrop-filter: blur(20px); border: 1px solid rgba(254, 223, 0, 0.18); }
        .glass-input { background: rgba(5, 11, 20, 0.75); border: 1px solid rgba(255, 255, 255, 0.12); color: #fff; }
        .glass-input:focus { border-color: #fedf00; box-shadow: 0 0 20px rgba(254, 223, 0, 0.3); outline: none; }
        .immersive-btn { position: relative; overflow: hidden; transition: all 0.3s ease; cursor: pointer; }
        .immersive-btn::after { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent); transition: 0.5s; }
        .immersive-btn:hover::after { left: 100%; }
        .immersive-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(254, 223, 0, 0.3); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #050b14; }
        ::-webkit-scrollbar-thumb { background: #002776; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen">

    <div class="max-w-5xl mx-auto space-y-8 pb-12">
        
        <!-- ENCABEZADO DE MÓDULO -->
        <div class="glass-panel p-6 md:p-8 rounded-3xl border border-brasil-yellow/20 shadow-2xl">
            <h3 class="font-cinzel text-2xl font-bold text-amber-400 mb-2 flex items-center">
                <i class="fa-solid fa-utensils mr-3 text-amber-400"></i> Control de Menú y Comidas
            </h3>
            <p class="text-slate-300 text-sm">Registra las previsiones o consumos de alimentación y gastos en restaurantes o supermercados en Reales.</p>
        </div>

        <!-- FORMULARIO DE INGRESO -->
        <div class="glass-panel p-6 md:p-8 rounded-3xl border border-brasil-yellow/20 shadow-2xl space-y-6">
            <input type="hidden" id="menu-id">
            
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Mes -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">
                        <i class="fa-solid fa-calendar-days text-amber-400 mr-1.5"></i> Mes:
                    </label>
                    <select id="menu_mes" class="glass-input w-full px-4 py-3 rounded-xl text-sm">
                        <option value="Enero">Enero</option>
                        <option value="Febrero">Febrero</option>
                        <option value="Marzo">Marzo</option>
                        <option value="Abril">Abril</option>
                        <option value="Mayo">Mayo</option>
                        <option value="Junio">Junio</option>
                        <option value="Julio">Julio</option>
                        <option value="Agosto">Agosto</option>
                        <option value="Septiembre">Septiembre</option>
                        <option value="Octubre">Octubre</option>
                        <option value="Noviembre">Noviembre</option>
                        <option value="Diciembre">Diciembre</option>
                    </select>
                </div>
                <!-- Desde -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">
                        <i class="fa-solid fa-calendar-check text-emerald-400 mr-1.5"></i> Desde:
                    </label>
                    <input type="date" id="menu_desde" class="glass-input w-full px-4 py-3 rounded-xl text-sm">
                </div>
                <!-- Hasta -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">
                        <i class="fa-solid fa-calendar-xmark text-rose-400 mr-1.5"></i> Hasta:
                    </label>
                    <input type="date" id="menu_hasta" class="glass-input w-full px-4 py-3 rounded-xl text-sm">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Cantidad de días -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">
                        <i class="fa-solid fa-sun text-yellow-400 mr-1.5"></i> Cantidad de Días:
                    </label>
                    <input type="text" inputmode="numeric" id="menu_dias" class="glass-input w-full px-4 py-3 rounded-xl text-sm font-bold text-amber-300" value="1" placeholder="Ej: 7">
                </div>
                <!-- Costo en reales -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">
                        <i class="fa-solid fa-coins text-brasil-green mr-1.5"></i> Costo en Reales (R$):
                    </label>
                    <input type="text" inputmode="decimal" id="menu_reales" class="glass-input w-full px-4 py-3 rounded-xl text-sm" placeholder="Ej: 1500.00">
                </div>
            </div>

            <!-- BOTONES DE ACCIÓN -->
            <div class="flex flex-wrap items-center gap-4 pt-4 border-t border-white/10">
                <button type="button" onclick="window.guardarMenu()" class="immersive-btn px-8 py-4 rounded-xl bg-gradient-to-r from-brasil-green to-emerald-700 text-white font-bold tracking-wider uppercase text-xs shadow-xl">
                    <i class="fa-solid fa-floppy-disk mr-2"></i> Guardar Menú
                </button>
                <button type="button" id="btn-cancelar-edicion" onclick="window.cancelarEdicionMenu()" class="hidden px-5 py-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold tracking-wider uppercase text-xs">
                    Cancelar Edición
                </button>
            </div>
        </div>

        <!-- HISTORIAL -->
        <div class="glass-panel p-6 md:p-8 rounded-3xl border border-brasil-yellow/20 shadow-2xl">
            <h4 class="font-cinzel text-lg font-bold text-white mb-4">Historial de Menús y Comidas Registrados</h4>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="bg-slate-900/80 text-xs uppercase text-brasil-yellow tracking-wider border-b border-white/10">
                        <tr>
                            <th class="p-3">Mes</th>
                            <th class="p-3">Período (Desde / Hasta)</th>
                            <th class="p-3">Días</th>
                            <th class="p-3 text-brasil-green">Costo en Reales</th>
                            <th class="p-3 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="historial-menu-body" class="divide-y divide-white/5">
                        <!-- Dinámico -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- SCRIPT DE FIRESTORE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, deleteDoc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDGFHR5hzOFtg7wnM2DGJfBTxPp-h8vyp0",
          authDomain: "bitacora-costos-brasil.firebaseapp.com",
          projectId: "bitacora-costos-brasil",
          storageBucket: "bitacora-costos-brasil.firebasestorage.app",
          messagingSenderId: "558877802256",
          appId: "1:558877802256:web:580e6a100a17b0ba062f95"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const mesInput = document.getElementById("menu_mes");
        const desdeInput = document.getElementById("menu_desde");
        const hastaInput = document.getElementById("menu_hasta");
        const diasInput = document.getElementById("menu_dias");
        const realesInput = document.getElementById("menu_reales");
        const menuIdInput = document.getElementById("menu-id");
        const btnCancelar = document.getElementById("btn-cancelar-edicion");
        const btnGuardar = document.querySelector("button[onclick='window.guardarMenu()']");
        const historialBody = document.getElementById("historial-menu-body");

        function parsearNumero(valor) {
            if (!valor) return 0;
            return parseFloat(valor.toString().replace(',', '.')) || 0;
        }

        // Cálculo automático de días al modificar las fechas (opcional, editable libremente)
        function calcularDiasMenu() {
            const desdeVal = desdeInput.value;
            const hastaVal = hastaInput.value;

            if (desdeVal && hastaVal) {
                const fechaIn = new Date(desdeVal);
                const fechaOut = new Date(hastaVal);
                const diferenciaTiempo = fechaOut - fechaIn;
                const dias = Math.round(diferenciaTiempo / (1000 * 60 * 60 * 24)) + 1; // Incluyendo el día de inicio

                if (dias > 0) {
                    diasInput.value = dias;
                }
            }
        }

        desdeInput.addEventListener("change", calcularDiasMenu);
        hastaInput.addEventListener("change", calcularDiasMenu);

        window.guardarMenu = async function() {
            const id = menuIdInput.value;
            const mes = mesInput.value;
            const desde = desdeInput.value;
            const hasta = hastaInput.value;
            const dias = parseInt(diasInput.value) || 0;
            const reales = parsearNumero(realesInput.value);

            if (dias <= 0) {
                alert("La cantidad de días debe ser mayor a 0.");
                return;
            }
            if (reales <= 0) {
                alert("Ingresa un costo válido en reales mayor a 0.");
                return;
            }

            const menuData = {
                mes,
                desde: desde || "Sin especificar",
                hasta: hasta || "Sin especificar",
                dias,
                reales: reales.toFixed(2),
                timestamp: Date.now()
            };

            try {
                if (id) {
                    await updateDoc(doc(db, "menu_comidas", id), menuData);
                    alert("¡Registro de menú actualizado con éxito!");
                } else {
                    await addDoc(collection(db, "menu_comidas"), menuData);
                    alert("¡Registro de menú guardado con éxito!");
                }
                window.cancelarEdicionMenu();
            } catch (err) {
                alert("Error al guardar en Firestore: " + err.message);
            }
        };

        window.cancelarEdicionMenu = function() {
            mesInput.value = "Enero";
            desdeInput.value = "";
            hastaInput.value = "";
            diasInput.value = "1";
            realesInput.value = "";
            menuIdInput.value = "";
            if (btnCancelar) btnCancelar.classList.add("hidden");
            if (btnGuardar) btnGuardar.innerHTML = `<i class="fa-solid fa-floppy-disk mr-2"></i> Guardar Menú`;
        };

        // Escuchar datos en tiempo real con Firestore
        onSnapshot(collection(db, "menu_comidas"), (snapshot) => {
            if (!historialBody) return;
            historialBody.innerHTML = "";
            if (!snapshot.empty) {
                let docs = [];
                snapshot.forEach(docSnap => {
                    docs.push({ id: docSnap.id, ...docSnap.data() });
                });
                docs.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

                docs.forEach(item => {
                    const tr = document.createElement("tr");
                    tr.className = "hover:bg-slate-900/40 transition border-b border-white/5";
                    tr.innerHTML = `
                        <td class="p-3 font-semibold text-white">
                            <i class="fa-solid fa-calendar-days mr-2 text-amber-400"></i>${item.mes}
                        </td>
                        <td class="p-3 text-xs text-slate-300">
                            <div><span class="text-emerald-400">Desde:</span> ${item.desde}</div>
                            <div><span class="text-rose-400">Hasta:</span> ${item.hasta}</div>
                        </td>
                        <td class="p-3 text-xs text-white">
                            <span class="text-yellow-400 font-semibold">${item.dias}</span> días
                        </td>
                        <td class="p-3 font-cinzel font-bold text-brasil-green text-base bg-emerald-950/20 rounded">
                            R$ ${Number(item.reales).toFixed(2)}
                        </td>
                        <td class="p-3 text-center space-x-2">
                            <button type="button" onclick="window.editarMenu('${item.id}', '${item.mes}', '${item.desde}', '${item.hasta}', ${item.dias}, ${item.reales})" class="px-2.5 py-1.5 bg-blue-600/40 text-blue-300 rounded text-xs" title="Editar"><i class="fa-solid fa-pen"></i></button>
                            <button type="button" onclick="window.eliminarMenu('${item.id}')" class="px-2.5 py-1.5 bg-red-600/40 text-red-300 rounded text-xs" title="Eliminar"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    `;
                    historialBody.appendChild(tr);
                });
            } else {
                historialBody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-500 italic">Sin registros de menú en Cloud Firestore.</td></tr>`;
            }
        });

        window.editarMenu = function(id, mes, desde, hasta, dias, reales) {
            menuIdInput.value = id;
            mesInput.value = mes;
            desdeInput.value = desde !== "Sin especificar" ? desde : "";
            hastaInput.value = hasta !== "Sin especificar" ? hasta : "";
            diasInput.value = dias;
            realesInput.value = reales;

            if (btnCancelar) btnCancelar.classList.remove("hidden");
            if (btnGuardar) btnGuardar.innerHTML = `<i class="fa-solid fa-pen-to-square mr-2"></i> Actualizar Menú`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.eliminarMenu = async function(id) {
            if (confirm("¿Estás seguro de eliminar este registro de menú?")) {
                try {
                    await deleteDoc(doc(db, "menu_comidas", id));
                    alert("Registro eliminado correctamente");
                } catch (err) {
                    alert("Error al eliminar: " + err.message);
                }
            }
        };
    </script>
</body>
</html>
