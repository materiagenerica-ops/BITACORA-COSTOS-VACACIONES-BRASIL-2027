<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoteles - Bitácora Brasil 2027</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brasil: { green: '#009b3a', yellow: '#fedf00', blue: '#002776', dark: '#050b14', card: '#0a1628' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #050b14; color: #f8fafc; margin: 0; padding: 20px; }
        .glass-panel { background: rgba(10, 22, 40, 0.88); backdrop-filter: blur(20px); border: 1px solid rgba(254, 223, 0, 0.18); }
        .glass-input { background: rgba(5, 11, 20, 0.75); border: 1px solid rgba(255, 255, 255, 0.12); color: #fff; }
        .glass-input:focus { border-color: #fedf00; box-shadow: 0 0 20px rgba(254, 223, 0, 0.3); outline: none; }
        #mapa-hotel { height: 380px; width: 100%; border-radius: 1rem; border: 1px solid rgba(254, 223, 0, 0.2); }
    </style>
</head>
<body class="min-h-screen">
    <div class="max-w-5xl mx-auto space-y-8 pb-12">
        <div class="glass-panel p-6 md:p-8 rounded-3xl border border-brasil-yellow/20 shadow-2xl">
            <h3 class="font-cinzel text-2xl font-bold text-amber-400 mb-2 flex items-center">
                <i class="fa-solid fa-hotel mr-3 text-amber-400"></i> Hoteles y Alojamientos Multi-Moneda
            </h3>
            <p class="text-slate-300 text-sm">Gestiona reservas de hospedaje en Argentina ($ ARS) o Brasil (R$).</p>
        </div>

        <div class="glass-panel p-6 md:p-8 rounded-3xl border border-brasil-yellow/20 shadow-2xl space-y-6">
            <input type="hidden" id="hotel-id">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Nombre del Hotel:</label>
                    <input type="text" id="hotel_nombre" class="glass-input w-full px-4 py-3 rounded-xl text-sm" placeholder="Ej: Hotel Copacabana">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Dirección Exacta:</label>
                    <input type="text" id="hotel_direccion" class="glass-input w-full px-4 py-3 rounded-xl text-sm" placeholder="Ej: Av. Atlântica 1702, Copacabana">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Lugar / Destino:</label>
                    <select id="hotel_lugar" class="glass-input w-full px-4 py-3 rounded-xl text-sm font-bold text-amber-300 bg-slate-900">
                        <option value="Sao Gabriel">Sao Gabriel</option>
                        <option value="Capão da Canoa">Capão da Canoa</option>
                        <option value="Torres">Torres</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Check-in:</label>
                    <input type="date" id="check_in" class="glass-input w-full px-4 py-3 rounded-xl text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Check-out:</label>
                    <input type="date" id="check_out" class="glass-input w-full px-4 py-3 rounded-xl text-sm">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Noches:</label>
                    <input type="number" id="cantidad_noches" class="glass-input w-full px-4 py-3 rounded-xl text-sm font-bold text-amber-300" value="1" min="1">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Personas (Pax):</label>
                    <input type="number" id="cantidad_personas" class="glass-input w-full px-4 py-3 rounded-xl text-sm" value="2" min="1">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Moneda:</label>
                    <select id="moneda_hotel" class="glass-input w-full px-4 py-3 rounded-xl text-sm font-bold text-amber-300 bg-slate-900">
                        <option value="ARS">🇦🇷 Argentina ($ ARS)</option>
                        <option value="BRL">🇧🇷 Brasil (R$ Reales)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2" id="label-costo">Costo Total ($):</label>
                    <input type="number" id="costo_hotel" class="glass-input w-full px-4 py-3 rounded-xl text-sm font-bold text-brasil-green" placeholder="Ej: 85000" step="any">
                </div>
            </div>

            <!-- GOOGLE MAPS IFRAME -->
            <div class="pt-4 border-t border-white/10 space-y-3">
                <label class="block text-xs font-bold uppercase tracking-wider text-cyan-400">Ubicación en Google Maps:</label>
                <iframe id="mapa-hotel" src="https://maps.google.com/maps?q=Torres+Brasil&output=embed" allowfullscreen="" loading="lazy"></iframe>
            </div>

            <div class="flex items-center gap-4 pt-2">
                <button type="button" id="btn-guardar-hotel" class="px-8 py-4 rounded-xl bg-brasil-green text-white font-bold tracking-wider uppercase text-xs shadow-xl cursor-pointer">Guardar Hotel</button>
            </div>
        </div>

        <div class="glass-panel p-6 md:p-8 rounded-3xl border border-brasil-yellow/20 shadow-2xl">
            <h4 class="font-cinzel text-lg font-bold text-white mb-4">Historial de Alojamientos</h4>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="bg-slate-900/80 text-xs uppercase text-brasil-yellow tracking-wider border-b border-white/10">
                        <tr>
                            <th class="p-3">Hotel / Dirección</th>
                            <th class="p-3">Noches</th>
                            <th class="p-3">Moneda</th>
                            <th class="p-3 text-brasil-green">Costo Total</th>
                            <th class="p-3 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="historial-hoteles-body" class="divide-y divide-white/5"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const db = getFirestore(initializeApp({
          apiKey: "AIzaSyDGFHR5hzOFtg7wnM2DGJfBTxPp-h8vyp0",
          authDomain: "bitacora-costos-brasil.firebaseapp.com",
          projectId: "bitacora-costos-brasil",
          storageBucket: "bitacora-costos-brasil.firebasestorage.app",
          messagingSenderId: "558877802256",
          appId: "1:558877802256:web:580e6a100a17b0ba062f95"
        }));

        const nombreInput = document.getElementById("hotel_nombre");
        const direccionInput = document.getElementById("hotel_direccion");
        const lugarInput = document.getElementById("hotel_lugar");
        const checkInInput = document.getElementById("check_in");
        const checkOutInput = document.getElementById("check_out");
        const nochesInput = document.getElementById("cantidad_noches");
        const personasInput = document.getElementById("cantidad_personas");
        const monedaSelect = document.getElementById("moneda_hotel");
        const costoInput = document.getElementById("costo_hotel");
        const labelCosto = document.getElementById("label-costo");
        const mapaIframe = document.getElementById("mapa-hotel");

        // Lógica idéntica a combustible para actualizar el mapa en tiempo real
        function actualizarMapa() {
            const nom = nombreInput.value.trim();
            const dir = direccionInput.value.trim();
            const lug = lugarInput.value;
            
            const consulta = `${nom} ${dir} ${lug} Brasil`.trim();
            const query = encodeURIComponent(consulta);
            mapaIframe.src = `https://maps.google.com/maps?q=${query}&output=embed`;
        }

        [nombreInput, direccionInput, lugarInput].forEach(el => {
            el.addEventListener("input", actualizarMapa);
        });
        lugarInput.addEventListener("change", actualizarMapa);

        monedaSelect.addEventListener("change", () => {
            labelCosto.textContent = monedaSelect.value === 'BRL' ? "Costo Total (R$):" : "Costo Total ($):";
        });

        checkInInput.addEventListener("change", calcNoches);
        checkOutInput.addEventListener("change", calcNoches);

        function calcNoches() {
            if (checkInInput.value && checkOutInput.value) {
                const diff = new Date(checkOutInput.value) - new Date(checkInInput.value);
                const dias = Math.round(diff / (1000 * 60 * 60 * 24));
                if (dias > 0) nochesInput.value = dias;
            }
        }

        document.getElementById("btn-guardar-hotel").addEventListener("click", async () => {
            const nombre = nombreInput.value.trim();
            const direccion = direccionInput.value.trim();
            const lugar = lugarInput.value;
            const checkIn = checkInInput.value || "Sin especificar";
            const checkOut = checkOutInput.value || "Sin especificar";
            const noches = parseInt(nochesInput.value) || 1;
            const personas = parseInt(personasInput.value) || 1;
            const moneda = monedaSelect.value;
            const costo = parseFloat(costoInput.value) || 0;

            if (!nombre) { alert("Ingresa el nombre del hotel"); return; }
            if (costo <= 0) { alert("Ingresa un costo válido mayor a 0"); return; }

            await addDoc(collection(db, "hoteles_reservas"), {
                nombre,
                direccion,
                lugar,
                checkIn,
                checkOut,
                noches,
                personas,
                moneda,
                costo: costo.toFixed(2),
                timestamp: Date.now()
            });

            alert("Hotel guardado con éxito");
            nombreInput.value = "";
            direccionInput.value = "";
            costoInput.value = "";
            actualizarMapa();
        });

        onSnapshot(collection(db, "hoteles_reservas"), (snap) => {
            const tbody = document.getElementById("historial-hoteles-body");
            tbody.innerHTML = "";
            let primerItem = true;

            snap.forEach(d => {
                const item = d.data();
                const sim = item.moneda === 'BRL' ? 'R$' : '$';
                const dirTxt = item.direccion ? `<span class="text-xs text-slate-400 block">${item.direccion}</span>` : '';
                
                if (primerItem) {
                    actualizarMapa();
                    primerItem = false;
                }

                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td class="p-3 font-semibold text-white">${item.nombre} <span class="text-xs text-cyan-400 block">${item.lugar}</span>${dirTxt}</td>
                    <td class="p-3">${item.noches} noches</td>
                    <td class="p-3 font-bold">${item.moneda}</td>
                    <td class="p-3 text-brasil-green font-bold">${sim} ${item.costo}</td>
                    <td class="p-3 text-center">
                        <button onclick="window.verEnMapa('${item.nombre}', '${item.direccion || ''}', '${item.lugar}')" class="text-cyan-400 cursor-pointer mr-3" title="Ver en Mapa"><i class="fa-solid fa-map"></i></button>
                        <button onclick="window.delHotel('${d.id}')" class="text-red-400 cursor-pointer" title="Eliminar"><i class="fa-solid fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        });

        window.verEnMapa = (nombre, direccion, lugar) => {
            const consulta = `${nombre} ${direccion} ${lugar} Brasil`.trim();
            mapaIframe.src = `https://maps.google.com/maps?q=${encodeURIComponent(consulta)}&output=embed`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.delHotel = async (id) => { 
            if (confirm("¿Eliminar este alojamiento?")) {
                await deleteDoc(doc(db, "hoteles_reservas", id)); 
            }
        };
    </script>
</body>
</html>
