<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combustible - Bitácora Brasil 2027</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brasil: { green: '#009b3a', yellow: '#fedf00', blue: '#002776', dark: '#050b14', card: '#0a1628' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #050b14; color: #f8fafc; margin: 0; padding: 20px; }
        .glass-panel { background: rgba(10, 22, 40, 0.88); backdrop-filter: blur(20px); border: 1px solid rgba(254, 223, 0, 0.18); }
        .glass-input { background: rgba(5, 11, 20, 0.75); border: 1px solid rgba(255, 255, 255, 0.12); color: #fff; }
        .glass-input:focus { border-color: #fedf00; box-shadow: 0 0 20px rgba(254, 223, 0, 0.3); outline: none; }
        .immersive-btn { position: relative; overflow: hidden; transition: all 0.3s ease; cursor: pointer; }
    </style>
</head>
<body class="min-h-screen">

    <div class="max-w-5xl mx-auto space-y-8 pb-12">
        
        <!-- ENCABEZADO -->
        <div class="glass-panel p-6 md:p-8 rounded-3xl border border-brasil-yellow/20 shadow-2xl">
            <h3 class="font-cinzel text-2xl font-bold text-amber-400 mb-2 flex items-center">
                <i class="fa-solid fa-gas-pump mr-3 text-amber-400"></i> Control de Combustible Multi-Moneda
            </h3>
            <p class="text-slate-300 text-sm">Calcula trayectos detectando automáticamente si circulas en Argentina ($ ARS) o Brasil (R$).</p>
        </div>

        <!-- FORMULARIO -->
        <div class="glass-panel p-6 md:p-8 rounded-3xl border border-brasil-yellow/20 shadow-2xl space-y-6">
            <input type="hidden" id="combustible-id">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Desde (Origen):</label>
                    <input type="text" id="origen" class="glass-input w-full px-4 py-3 rounded-xl text-sm" placeholder="Ej: Buenos Aires">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Hasta (Destino):</label>
                    <input type="text" id="destino" class="glass-input w-full px-4 py-3 rounded-xl text-sm" placeholder="Ej: Torres">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Kilómetros:</label>
                    <input type="text" inputmode="decimal" id="kilometros" class="glass-input w-full px-4 py-3 rounded-xl text-sm" placeholder="Ej: 850">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Rendimiento (Km/L):</label>
                    <input type="text" inputmode="decimal" id="km_litro" class="glass-input w-full px-4 py-3 rounded-xl text-sm" placeholder="Ej: 12.5">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Territorio / Moneda:</label>
                    <select id="territorio" class="glass-input w-full px-4 py-3 rounded-xl text-sm font-bold text-amber-300">
                        <option value="ARG">🇦🇷 Argentina (Precio en $ ARS)</option>
                        <option value="BRA">🇧🇷 Brasil (Precio en R$ Reales)</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2" id="label-valor-litro">
                        Valor Litro Nafta ($ ARS):
                    </label>
                    <input type="text" inputmode="decimal" id="valor_litro" class="glass-input w-full px-4 py-3 rounded-xl text-sm" placeholder="Ej: 1150.00">
                </div>
                <div class="flex items-end">
                    <div class="w-full p-4 rounded-xl bg-amber-950/30 border border-amber-500/30 flex items-center justify-between">
                        <div>
                            <span class="text-[10px] uppercase tracking-wider text-amber-300/80 font-bold block">Costo Final Estimado:</span>
                            <div id="costo-final-display" class="font-cinzel text-2xl font-black text-amber-400">$ 0.00</div>
                        </div>
                        <div id="moneda-sufijo" class="text-xs font-bold text-slate-400 px-2 py-1 bg-slate-900 rounded">ARS</div>
                    </div>
                </div>
            </div>

            <!-- MAPA -->
            <div class="w-full h-64 rounded-xl overflow-hidden border border-white/10 bg-slate-950">
                <iframe id="map-iframe" width="100%" height="100%" style="border:0;" loading="lazy" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3484.0!2d-50.122!3d-30.337!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzDCsDIwJzEzLjIiUyA1MMKwMDcnMTkuMiJX!5e0!3m2!1ses!2sar!4v1620000000000!5m2!1ses!2sar"></iframe>
            </div>

            <!-- BOTONES -->
            <div class="flex flex-wrap items-center gap-4 pt-4 border-t border-white/10">
                <button type="button" onclick="window.intentarGuardar()" class="immersive-btn px-8 py-4 rounded-xl bg-gradient-to-r from-brasil-green to-emerald-700 text-white font-bold tracking-wider uppercase text-xs shadow-xl">
                    <i class="fa-solid fa-floppy-disk mr-2"></i> Guardar Recorrido
                </button>
                <button type="button" id="btn-cancelar-edicion" onclick="window.cancelarEdicion()" class="hidden px-5 py-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold tracking-wider uppercase text-xs">
                    Cancelar Edición
                </button>
            </div>
        </div>

        <!-- HISTORIAL -->
        <div class="glass-panel p-6 md:p-8 rounded-3xl border border-brasil-yellow/20 shadow-2xl">
            <h4 class="font-cinzel text-lg font-bold text-white mb-4">Historial de Recorridos y Consumos</h4>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="bg-slate-900/80 text-xs uppercase text-brasil-yellow tracking-wider border-b border-white/10">
                        <tr>
                            <th class="p-3">Trayecto</th>
                            <th class="p-3">Km / Rend</th>
                            <th class="p-3">Territorio</th>
                            <th class="p-3">Valor Litro</th>
                            <th class="p-3 text-brasil-green">Costo Final</th>
                            <th class="p-3 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="historial-combustible-body" class="divide-y divide-white/5">
                        <!-- Dinámico -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, deleteDoc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDGFHR5hzOFtg7wnM2DGJfBTxPp-h8vyp0",
          authDomain: "bitacora-costos-brasil.firebaseapp.com",
          projectId: "bitacora-costos-brasil",
          storageBucket: "bitacora-costos-brasil.firebasestorage.app",
          messagingSenderId: "558877802256",
          appId: "1:558877802256:web:580e6a100a17b0ba062f95"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const origenInput = document.getElementById("origen");
        const destinoInput = document.getElementById("destino");
        const kmInput = document.getElementById("kilometros");
        const kmLitroInput = document.getElementById("km_litro");
        const territorioSelect = document.getElementById("territorio");
        const valorLitroInput = document.getElementById("valor_litro");
        const labelValorLitro = document.getElementById("label-valor-litro");
        const costoFinalDisplay = document.getElementById("costo-final-display");
        const monedaSufijo = document.getElementById("moneda-sufijo");
        const mapIframe = document.getElementById("map-iframe");
        const historialBody = document.getElementById("historial-combustible-body");
        const combustibleIdInput = document.getElementById("combustible-id");
        const btnCancelar = document.getElementById("btn-cancelar-edicion");
        const btnGuardar = document.querySelector("button[onclick='window.intentarGuardar()']");

        function parsearNumero(valor) {
            if (!valor) return 0;
            return parseFloat(valor.toString().replace(',', '.')) || 0;
        }

        // Detección automática de territorio basada en las palabras ingresadas en destino u origen
        function actualizarTerritorioAutomatico() {
            const dest = destinoInput.value.toLowerCase();
            const orig = origenInput.value.toLowerCase();
            
            // Palabras clave de Brasil
            const palabrasBrasil = ["torres", "capao", "capão", "florianopolis", "gramado", "osorio", "porto alegre", "brasil", "tramandai"];
            
            const esBrasil = palabrasBrasil.some(p => dest.includes(p) || orig.includes(p));
            
            if (esBrasil) {
                territorioSelect.value = "BRA";
            } else {
                territorioSelect.value = "ARG";
            }
            actualizarEtiquetasMoneda();
        }

        function actualizarEtiquetasMoneda() {
            const territorio = territorioSelect.value;
            if (territorio === "BRA") {
                labelValorLitro.textContent = "Valor Litro Nafta (R$ Reales):";
                monedaSufijo.textContent = "BRL";
            } else {
                labelValorLitro.textContent = "Valor Litro Nafta ($ ARS):";
                monedaSufijo.textContent = "ARS";
            }
            calcularCostoCombustible();
        }

        function calcularCostoCombustible() {
            const km = parsearNumero(kmInput.value);
            const kmLitro = parsearNumero(kmLitroInput.value);
            const valorLitro = parsearNumero(valorLitroInput.value);
            const territorio = territorioSelect.value;

            let costoFinal = 0;
            if (kmLitro > 0) {
                costoFinal = (km / kmLitro) * valorLitro;
            }

            const simbolo = territorio === "BRA" ? "R$" : "$";
            costoFinalDisplay.textContent = `${simbolo} ${costoFinal.toFixed(2)}`;

            const origen = origenInput.value.trim();
            const destino = destinoInput.value.trim();
            
            if (origen && destino) {
                mapIframe.src = `https://www.google.com/maps?q=${encodeURIComponent(origen)}+a+${encodeURIComponent(destino)}&output=embed`;
            }
        }

        destinoInput.addEventListener("input", () => {
            actualizarTerritorioAutomatico();
        });
        origenInput.addEventListener("input", () => {
            actualizarTerritorioAutomatico();
        });
        territorioSelect.addEventListener("change", actualizarEtiquetasMoneda);

        [kmInput, kmLitroInput, valorLitroInput].forEach(input => {
            if(input) input.addEventListener("input", calcularCostoCombustible);
        });

        window.intentarGuardar = async function() {
            const id = combustibleIdInput.value;
            const origen = origenInput.value.trim();
            const destino = destinoInput.value.trim();
            const kilometros = parsearNumero(kmInput.value);
            const kmLitro = parsearNumero(kmLitroInput.value);
            const valorLitro = parsearNumero(valorLitroInput.value);
            const territorio = territorioSelect.value;
            
            if (!origen || !destino) {
                alert("Completa 'Desde' y 'Hasta'.");
                return;
            }
            if (kilometros <= 0 || kmLitro <= 0 || valorLitro <= 0) {
                alert("Verifica que los valores numéricos sean mayores a 0.");
                return;
            }

            const costoFinal = ((kilometros / kmLitro) * valorLitro).toFixed(2);

            const recorridoData = {
                origen,
                destino,
                kilometros,
                kmLitro,
                territorio,
                valor_litro: valorLitro,
                costoFinal,
                timestamp: Date.now()
            };

            try {
                if (id) {
                    await updateDoc(doc(db, "combustible_recorridos", id), recorridoData);
                    alert("¡Recorrido actualizado con éxito!");
                } else {
                    await addDoc(collection(db, "combustible_recorridos"), recorridoData);
                    alert("¡Recorrido guardado con éxito!");
                }
                window.cancelarEdicion();
            } catch (err) {
                alert("Error en Firestore: " + err.message);
            }
        };

        window.cancelarEdicion = function() {
            origenInput.value = "";
            destinoInput.value = "";
            kmInput.value = "";
            kmLitroInput.value = "";
            valorLitroInput.value = "";
            territorioSelect.value = "ARG";
            combustibleIdInput.value = "";
            if (btnCancelar) btnCancelar.classList.add("hidden");
            if (btnGuardar) btnGuardar.innerHTML = `<i class="fa-solid fa-floppy-disk mr-2"></i> Guardar Recorrido`;
            costoFinalDisplay.textContent = `$ 0.00`;
            actualizarEtiquetasMoneda();
            mapIframe.src = `https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3484.0!2d-50.122!3d-30.337!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzDCsDIwJzEzLjIiUyA1MMKwMDcnMTkuMiJX!5e0!3m2!1ses!2sar!4v1620000000000!5m2!1ses!2sar`;
        };

        // Historial
        onSnapshot(collection(db, "combustible_recorridos"), (snapshot) => {
            if (!historialBody) return;
            historialBody.innerHTML = "";
            if (!snapshot.empty) {
                let docs = [];
                snapshot.forEach(docSnap => {
                    docs.push({ id: docSnap.id, ...docSnap.data() });
                });
                docs.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

                docs.forEach(item => {
                    const esBrasil = item.territorio === "BRA";
                    const monedaSimbolo = esBrasil ? "R$" : "$";
                    const badgeTerritorio = esBrasil 
                        ? `<span class="px-2 py-0.5 rounded bg-blue-900/50 text-blue-300 text-[10px] font-bold">Brasil (BRL)</span>` 
                        : `<span class="px-2 py-0.5 rounded bg-amber-900/50 text-amber-300 text-[10px] font-bold">Argentina (ARS)</span>`;

                    const tr = document.createElement("tr");
                    tr.className = "hover:bg-slate-900/40 transition border-b border-white/5";
                    tr.innerHTML = `
                        <td class="p-3 font-semibold text-white"><i class="fa-solid fa-route mr-2 text-amber-400"></i>${item.origen} &rarr; ${item.destino}</td>
                        <td class="p-3 text-xs">${item.kilometros} km <span class="text-slate-500">(${item.kmLitro} km/L)</span></td>
                        <td class="p-3">${badgeTerritorio}</td>
                        <td class="p-3">${monedaSimbolo} ${parseFloat(item.valor_litro).toFixed(2)}</td>
                        <td class="p-3 font-cinzel font-bold text-brasil-green text-base bg-emerald-950/20 rounded">${monedaSimbolo} ${item.costoFinal}</td>
                        <td class="p-3 text-center space-x-2">
                            <button type="button" onclick="window.editarRecorrido('${item.id}', '${item.origen}', '${item.destino}', ${item.kilometros}, ${item.kmLitro}, '${item.territorio || 'ARG'}', ${item.valor_litro})" class="px-2.5 py-1.5 bg-blue-600/40 text-blue-300 rounded text-xs" title="Editar"><i class="fa-solid fa-pen"></i></button>
                            <button type="button" onclick="window.eliminarRecorrido('${item.id}')" class="px-2.5 py-1.5 bg-red-600/40 text-red-300 rounded text-xs" title="Eliminar"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    `;
                    historialBody.appendChild(tr);
                });
            } else {
                historialBody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-500 italic">Sin recorridos de combustible registrados.</td></tr>`;
            }
        });

        window.editarRecorrido = function(id, origen, destino, km, kmLitro, territorio, valorLitro) {
            combustibleIdInput.value = id;
            origenInput.value = origen;
            destinoInput.value = destino;
            kmInput.value = km;
            kmLitroInput.value = kmLitro;
            territorioSelect.value = territorio;
            valorLitroInput.value = valorLitro;
            actualizarEtiquetasMoneda();

            if (btnCancelar) btnCancelar.classList.remove("hidden");
            if (btnGuardar) btnGuardar.innerHTML = `<i class="fa-solid fa-pen-to-square mr-2"></i> Actualizar Recorrido`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.eliminarRecorrido = async function(id) {
            if (confirm("¿Estás seguro de eliminar este registro?")) {
                try {
                    await deleteDoc(doc(db, "combustible_recorridos", id));
                    alert("Eliminado correctamente");
                } catch (err) {
                    alert("Error al eliminar: " + err.message);
                }
            }
        };
    </script>
</body>
</html>
