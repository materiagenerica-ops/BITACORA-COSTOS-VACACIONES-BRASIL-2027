<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combustible - Bitácora Brasil 2027</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brasil: { green: '#009b3a', yellow: '#fedf00', blue: '#002776', dark: '#050b14', card: '#0a1628' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #050b14; color: #f8fafc; margin: 0; padding: 20px; }
        .glass-panel { background: rgba(10, 22, 40, 0.88); backdrop-filter: blur(20px); border: 1px solid rgba(254, 223, 0, 0.18); }
        .glass-input { background: rgba(5, 11, 20, 0.75); border: 1px solid rgba(255, 255, 255, 0.12); color: #fff; }
        .glass-input:focus { border-color: #fedf00; box-shadow: 0 0 20px rgba(254, 223, 0, 0.3); outline: none; }
        .immersive-btn { position: relative; overflow: hidden; transition: all 0.3s ease; cursor: pointer; }
    </style>
</head>
<body class="min-h-screen">

    <div class="max-w-5xl mx-auto space-y-8 pb-12">
        
        <!-- ENCABEZADO -->
        <div class="glass-panel p-6 md:p-8 rounded-3xl border border-brasil-yellow/20 shadow-2xl">
            <h3 class="font-cinzel text-2xl font-bold text-amber-400 mb-2 flex items-center">
                <i class="fa-solid fa-gas-pump mr-3 text-amber-400"></i> Control de Combustible y Recorridos
            </h3>
            <p class="text-slate-300 text-sm">Gestiona los trayectos, calcula costos en Reales y guarda los registros.</p>
        </div>

        <!-- FORMULARIO -->
        <div class="glass-panel p-6 md:p-8 rounded-3xl border border-brasil-yellow/20 shadow-2xl space-y-6">
            <input type="hidden" id="combustible-id">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Desde:</label>
                    <input type="text" id="origen" class="glass-input w-full px-4 py-3 rounded-xl text-sm" placeholder="Ej: Buenos Aires">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Hasta:</label>
                    <input type="text" id="destino" class="glass-input w-full px-4 py-3 rounded-xl text-sm" placeholder="Ej: Torres">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Kilómetros:</label>
                    <input type="text" inputmode="decimal" id="kilometros" class="glass-input w-full px-4 py-3 rounded-xl text-sm" placeholder="Ej: 850">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Km por Litro:</label>
                    <input type="text" inputmode="decimal" id="km_litro" class="glass-input w-full px-4 py-3 rounded-xl text-sm" placeholder="Ej: 12.5">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Valor Litro ($ Reales):</label>
                    <input type="text" inputmode="decimal" id="valor_litro" class="glass-input w-full px-4 py-3 rounded-xl text-sm" placeholder="Ej: 6.29">
                </div>
            </div>

            <!-- RESULTADO Y MAPA -->
            <div class="p-5 rounded-2xl bg-amber-950/30 border border-amber-500/30 space-y-4">
                <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                    <div>
                        <span class="text-xs uppercase tracking-wider text-amber-300/80 font-bold">Costo Final Recorrido:</span>
                        <div id="costo-final-display" class="font-cinzel text-3xl font-black text-amber-400">R$ 0.00</div>
                    </div>
                </div>
                <div class="w-full h-72 rounded-xl overflow-hidden border border-white/10 bg-slate-950">
                    <iframe id="map-iframe" width="100%" height="100%" style="border:0;" loading="lazy" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3484.0!2d-50.122!3d-30.337!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzDCsDIwJzEzLjIiUyA1MMKwMDcnMTkuMiJX!5e0!3m2!1ses!2sar!4v1620000000000!5m2!1ses!2sar"></iframe>
                </div>
            </div>

            <!-- BOTÓN CON LLAMADA INLINE DIRECTA -->
            <div class="flex flex-wrap items-center gap-4 pt-4 border-t border-white/10">
                <button type="button" onclick="intentarGuardar()" class="immersive-btn px-8 py-4 rounded-xl bg-gradient-to-r from-brasil-green to-emerald-700 text-white font-bold tracking-wider uppercase text-xs shadow-xl">
                    <i class="fa-solid fa-floppy-disk mr-2"></i> Guardar Recorrido
                </button>
            </div>
        </div>

        <!-- HISTORIAL -->
        <div class="glass-panel p-6 md:p-8 rounded-3xl border border-brasil-yellow/20 shadow-2xl">
            <h4 class="font-cinzel text-lg font-bold text-white mb-4">Historial de Recorridos</h4>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="bg-slate-900/80 text-xs uppercase text-brasil-yellow tracking-wider border-b border-white/10">
                        <tr>
                            <th class="p-3">Trayecto</th>
                            <th class="p-3">Km</th>
                            <th class="p-3">Rendimiento</th>
                            <th class="p-3">Valor Litro</th>
                            <th class="p-3 text-brasil-green">Costo Final</th>
                            <th class="p-3 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="historial-combustible-body" class="divide-y divide-white/5">
                        <!-- Dinámico -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- SCRIPT GENERAL Y DE FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDGFHR5hzOFtg7wnM2DGJfBTxPp-h8vyp0",
          authDomain: "bitacora-costos-brasil.firebaseapp.com",
          projectId: "bitacora-costos-brasil",
          storageBucket: "bitacora-costos-brasil.firebasestorage.app",
          messagingSenderId: "558877802256",
          appId: "1:558877802256:web:580e6a100a17b0ba062f95"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const origenInput = document.getElementById("origen");
        const destinoInput = document.getElementById("destino");
        const kmInput = document.getElementById("kilometros");
        const kmLitroInput = document.getElementById("km_litro");
        const valorLitroInput = document.getElementById("valor_litro");
        const costoFinalDisplay = document.getElementById("costo-final-display");
        const mapIframe = document.getElementById("map-iframe");
        const historialBody = document.getElementById("historial-combustible-body");
        const combustibleIdInput = document.getElementById("combustible-id");

        function parsearNumero(valor) {
            if (!valor) return 0;
            return parseFloat(valor.toString().replace(',', '.')) || 0;
        }

        function calcularCostoCombustible() {
            const km = parsearNumero(kmInput.value);
            const kmLitro = parsearNumero(kmLitroInput.value);
            const valorLitro = parsearNumero(valorLitroInput.value);

            let costoFinal = 0;
            if (kmLitro > 0) {
                costoFinal = (km / kmLitro) * valorLitro;
            }

            costoFinalDisplay.textContent = `R$ ${costoFinal.toFixed(2)}`;

            const origen = origenInput.value.trim();
            const destino = destinoInput.value.trim();
            
            if (origen && destino) {
                mapIframe.src = `https://www.google.com/maps?q=${encodeURIComponent(origen)}+a+${encodeURIComponent(destino)}&output=embed`;
            }
        }

        [origenInput, destinoInput, kmInput, kmLitroInput, valorLitroInput].forEach(input => {
            if (input) input.addEventListener("input", calcularCostoCombustible);
        });

        // Función global expuesta al botón
        window.intentarGuardar = function() {
            alert("¡Click detectado correctamente!");

            const id = combustibleIdInput.value;
            const origen = origenInput.value.trim();
            const destino = destinoInput.value.trim();
            const kilometros = parsearNumero(kmInput.value);
            const kmLitro = parsearNumero(kmLitroInput.value);
            const valorLitro = parsearNumero(valorLitroInput.value);
            
            if (!origen || !destino) {
                alert("Completa 'Desde' y 'Hasta'.");
                return;
            }

            const costoFinal = ((kilometros / (kmLitro || 1)) * valorLitro).toFixed(2);

            const recorridoData = {
                origen,
                destino,
                kilometros,
                kmLitro,
                valor_litro: valorLitro,
                costoFinal,
                timestamp: Date.now()
            };

            const dbRef = ref(db, "combustible_recorridos");

            if (id) {
                update(ref(db, `combustible_recorridos/${id}`), recorridoData)
                    .then(() => alert("¡Actualizado con éxito!"))
                    .catch((err) => alert("Error Firebase: " + err.message));
            } else {
                set(push(dbRef), recorridoData)
                    .then(() => alert("¡Guardado con éxito!"))
                    .catch((err) => alert("Error Firebase: " + err.message));
            }
        };

        // Cargar historial
        onValue(ref(db, "combustible_recorridos"), (snapshot) => {
            if (!historialBody) return;
            historialBody.innerHTML = "";
            const data = snapshot.val();
            if (data) {
                Object.entries(data).reverse().forEach(([id, item]) => {
                    const tr = document.createElement("tr");
                    tr.className = "hover:bg-slate-900/40 transition border-b border-white/5";
                    tr.innerHTML = `
                        <td class="p-3 font-semibold text-white">${item.origen} &rarr; ${item.destino}</td>
                        <td class="p-3">${item.kilometros} km</td>
                        <td class="p-3">${item.kmLitro} km/L</td>
                        <td class="p-3">R$ ${parseFloat(item.valor_litro).toFixed(2)}</td>
                        <td class="p-3 font-cinzel font-bold text-amber-400 text-base">R$ ${item.costoFinal}</td>
                        <td class="p-3 text-center space-x-2">
                            <button type="button" onclick="window.editar('${id}', '${item.origen}', '${item.destino}', ${item.kilometros}, ${item.kmLitro}, ${item.valor_litro})" class="px-2 py-1 bg-blue-600/40 text-blue-300 rounded text-xs"><i class="fa-solid fa-pen"></i></button>
                            <button type="button" onclick="window.eliminar('${id}')" class="px-2 py-1 bg-red-600/40 text-red-300 rounded text-xs"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    `;
                    historialBody.appendChild(tr);
                });
            } else {
                historialBody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-500 italic">Sin registros.</td></tr>`;
            }
        });

        window.editar = function(id, origen, destino, km, kmLitro, valor) {
            combustibleIdInput.value = id;
            origenInput.value = origen;
            destinoInput.value = destino;
            kmInput.value = km;
            kmLitroInput.value = kmLitro;
            valorLitroInput.value = valor;
            calcularCostoCombustible();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.eliminar = function(id) {
            if (confirm("¿Eliminar registro?")) {
                remove(ref(db, `combustible_recorridos/${id}`))
                    .then(() => alert("Eliminado correctamente"))
                    .catch(err => alert("Error: " + err.message));
            }
        };
    </script>
</body>
</html>
