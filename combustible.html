<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combustible - Bitácora Brasil 2027</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brasil: { green: '#009b3a', yellow: '#fedf00', blue: '#002776', dark: '#050b14', card: '#0a1628' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #050b14; color: #f8fafc; margin: 0; padding: 20px; }
        .glass-panel { background: rgba(10, 22, 40, 0.88); backdrop-filter: blur(20px); border: 1px solid rgba(254, 223, 0, 0.18); }
        .glass-input { background: rgba(5, 11, 20, 0.75); border: 1px solid rgba(255, 255, 255, 0.12); color: #fff; }
        .glass-input:focus { border-color: #fedf00; box-shadow: 0 0 20px rgba(254, 223, 0, 0.3); outline: none; }
    </style>
</head>
<body class="min-h-screen">
    <div class="max-w-5xl mx-auto space-y-8 pb-12">
        <div class="glass-panel p-6 md:p-8 rounded-3xl border border-brasil-yellow/20 shadow-2xl">
            <h3 class="font-cinzel text-2xl font-bold text-amber-400 mb-2 flex items-center">
                <i class="fa-solid fa-gas-pump mr-3 text-amber-400"></i> Control de Combustible Multi-Moneda
            </h3>
            <p class="text-slate-300 text-sm">Calcula trayectos en Argentina ($ ARS) o Brasil (R$).</p>
        </div>

        <div class="glass-panel p-6 md:p-8 rounded-3xl border border-brasil-yellow/20 shadow-2xl space-y-6">
            <input type="hidden" id="combustible-id">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Desde (Origen):</label>
                    <input type="text" id="origen" class="glass-input w-full px-4 py-3 rounded-xl text-sm" placeholder="Ej: Buenos Aires">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Hasta (Destino):</label>
                    <input type="text" id="destino" class="glass-input w-full px-4 py-3 rounded-xl text-sm" placeholder="Ej: Torres">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Kilómetros:</label>
                    <input type="number" id="kilometros" class="glass-input w-full px-4 py-3 rounded-xl text-sm" placeholder="Ej: 850" value="0">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Rendimiento (Km/L):</label>
                    <input type="number" id="km_litro" class="glass-input w-full px-4 py-3 rounded-xl text-sm" placeholder="Ej: 12.5" value="0" step="0.1">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Territorio / Moneda:</label>
                    <select id="territorio" class="glass-input w-full px-4 py-3 rounded-xl text-sm font-bold text-amber-300 bg-slate-900">
                        <option value="ARG">🇦🇷 Argentina ($ ARS)</option>
                        <option value="BRA">🇧🇷 Brasil (R$ Reales)</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2" id="label-valor-litro">Valor Litro Nafta ($ ARS):</label>
                    <input type="number" id="valor_litro" class="glass-input w-full px-4 py-3 rounded-xl text-sm" placeholder="Ej: 1150.00" value="0" step="0.01">
                </div>
                <div class="flex items-end">
                    <div class="w-full p-4 rounded-xl bg-amber-950/30 border border-amber-500/30 flex items-center justify-between">
                        <div>
                            <span class="text-[10px] uppercase tracking-wider text-amber-300/80 font-bold block">Costo Final:</span>
                            <div id="costo-final-display" class="font-cinzel text-2xl font-black text-amber-400">$ 0.00</div>
                        </div>
                        <div id="moneda-sufijo" class="text-xs font-bold text-slate-400 px-2 py-1 bg-slate-900 rounded">ARS</div>
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-4 pt-4 border-t border-white/10">
                <button type="button" id="btn-guardar-combustible" class="px-8 py-4 rounded-xl bg-brasil-green text-white font-bold tracking-wider uppercase text-xs shadow-xl cursor-pointer">Guardar Recorrido</button>
            </div>
        </div>

        <div class="glass-panel p-6 md:p-8 rounded-3xl border border-brasil-yellow/20 shadow-2xl">
            <h4 class="font-cinzel text-lg font-bold text-white mb-4">Historial de Combustible</h4>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="bg-slate-900/80 text-xs uppercase text-brasil-yellow tracking-wider border-b border-white/10">
                        <tr>
                            <th class="p-3">Trayecto</th>
                            <th class="p-3">Km</th>
                            <th class="p-3">Moneda</th>
                            <th class="p-3 text-brasil-green">Costo Final</th>
                            <th class="p-3 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="historial-combustible-body" class="divide-y divide-white/5"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const db = getFirestore(initializeApp({
          apiKey: "AIzaSyDGFHR5hzOFtg7wnM2DGJfBTxPp-h8vyp0",
          authDomain: "bitacora-costos-brasil.firebaseapp.com",
          projectId: "bitacora-costos-brasil",
          storageBucket: "bitacora-costos-brasil.firebasestorage.app",
          messagingSenderId: "558877802256",
          appId: "1:558877802256:web:580e6a100a17b0ba062f95"
        }));

        const km = document.getElementById("kilometros");
        const kml = document.getElementById("km_litro");
        const valLitro = document.getElementById("valor_litro");
        const terr = document.getElementById("territorio");
        const display = document.getElementById("costo-final-display");
        const sufijo = document.getElementById("moneda-sufijo");

        function calc() {
            const k = parseFloat(km.value) || 0;
            const l = parseFloat(kml.value) || 0;
            const v = parseFloat(valLitro.value) || 0;
            const res = l > 0 ? (k / l) * v : 0;
            const sim = terr.value === "BRA" ? "R$" : "$";
            sufijo.textContent = terr.value === "BRA" ? "BRL" : "ARS";
            display.textContent = `${sim} ${res.toFixed(2)}`;
        }

        [km, kml, valLitro, terr].forEach(el => el.addEventListener("input", calc));
        terr.addEventListener("change", calc);

        document.getElementById("btn-guardar-combustible").addEventListener("click", async () => {
            const origen = document.getElementById("origen").value;
            const destino = document.getElementById("destino").value;
            if(!origen || !destino) { alert("Completa origen y destino"); return; }
            const k = parseFloat(km.value) || 0;
            const l = parseFloat(kml.value) || 0;
            const v = parseFloat(valLitro.value) || 0;
            const costoFinal = l > 0 ? ((k / l) * v).toFixed(2) : "0.00";

            await addDoc(collection(db, "combustible_recorridos"), {
                origen, destino, kilometros: k, valor_litro: v, territorio: terr.value, costoFinal, timestamp: Date.now()
            });
            alert("Guardado con éxito");
        });

        onSnapshot(collection(db, "combustible_recorridos"), (snap) => {
            const tbody = document.getElementById("historial-combustible-body");
            tbody.innerHTML = "";
            snap.forEach(d => {
                const item = d.data();
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td class="p-3">${item.origen} &rarr; ${item.destino}</td>
                    <td class="p-3">${item.kilometros} km</td>
                    <td class="p-3">${item.territorio}</td>
                    <td class="p-3 text-brasil-green font-bold">${item.territorio === 'BRA' ? 'R$' : '$'} ${item.costoFinal}</td>
                    <td class="p-3 text-center"><button onclick="window.del('${d.id}')" class="text-red-400"><i class="fa-solid fa-trash"></i></button></td>
                `;
                tbody.appendChild(tr);
            });
        });

        window.del = async (id) => { await deleteDoc(doc(db, "combustible_recorridos", id)); };
    </script>
</body>
</html>
